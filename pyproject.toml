[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlls-gram"
version = "2.12.1"
description = "Metric-aware Levenberg-Marquardt nonlinear least-squares for JAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Jesse Perla", email = "jesseperla@gmail.com" }]
keywords = [
    "levenberg-marquardt",
    "nonlinear-least-squares",
    "metric",
    "jax",
    "optimization",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.11.2",
]

[project.urls]
Homepage = "https://github.com/HighDimensionalEconLab/nlls_gram"
Repository = "https://github.com/HighDimensionalEconLab/nlls_gram"
Documentation = "https://highdimensionaleconlab.github.io/nlls_gram/"
Issues = "https://github.com/HighDimensionalEconLab/nlls_gram/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nlls_gram"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
benchmark = [
    "pytest-benchmark>=5.3.0",
]
dev = [
    "flax>=0.12.10",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
]
gpu = [
    "jax[cuda13]>=0.11.2 ; sys_platform == 'linux'",
    "metaljax>=0.11.9 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]
