site_name: nlls_gram
site_description: Levenberg-Marquardt and Gauss-Newton nonlinear least-squares for JAX
site_url: https://highdimensionaleconlab.github.io/nlls_gram/
repo_url: https://github.com/HighDimensionalEconLab/nlls_gram
repo_name: HighDimensionalEconLab/nlls_gram

theme:
  name: material
  features:
    - content.code.copy
    - navigation.top
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            inherited_members: true

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Levenberg-Marquardt and Tikhonov: ridge_lm.md
  - Gauss-Newton: newton.md
  - Univariate Box Optimization: box_secant.md
  - Ridge Operators and Preconditioners: metrics.md
  - Constraints: complementarity.md
  - Callbacks and Stopping: callbacks.md
  - Multi-Start: multi_start.md
  - Implicit Differentiation: implicit_ad.md
  - Row-wise Residuals: vmap_rows.md
  - Tuning and Capabilities: tuning_guide.md
  - References: references.md
  - API: api.md
